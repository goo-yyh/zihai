name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/zihai
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      BETTER_AUTH_URL: http://localhost:3000
      GITHUB_CLIENT_ID: ci-github-client
      GITHUB_CLIENT_SECRET: ci-github-secret
      GOOGLE_CLIENT_ID: ci-google-client
      GOOGLE_CLIENT_SECRET: ci-google-secret
      BLOB_READ_WRITE_TOKEN: vercel_blob_rw_ci_token
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
